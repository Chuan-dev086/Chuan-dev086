<svg viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" width="900" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <style>
            .typing-text {
                font-size: 48px;
                font-weight: bold;
                fill: #00D4FF;
                letter-spacing: 1px;
                animation: typing 6s steps(32, end) infinite;
                font-family: 'Courier New', monospace;
            }
            
            @keyframes typing {
                0% {
                    clip-path: inset(0 100% 0 0);
                }
                70% {
                    clip-path: inset(0 0 0 0);
                }
                85% {
                    clip-path: inset(0 0 0 0);
                }
                100% {
                    clip-path: inset(0 100% 0 0);
                }
            }
            
            .cursor {
                animation: blink 1s infinite;
            }
            
            @keyframes blink {
                0%, 49% {
                    opacity: 1;
                }
                50%, 100% {
                    opacity: 0;
                }
            }
        </style>
    </defs>
    
    <!-- 背景透明 -->
    <rect width="900" height="200" fill="transparent"/>
    
    <!-- 打字机文本 -->
    <text class="typing-text" x="50" y="110">👋 𝓗𝓲 𝓽𝓱𝓮𝓻𝓮, 𝓘'𝓶 ✌𝓒𝓗𝓤𝓐𝓝 𝓞𝓞𝓘✌</text>
    
    <!-- 闪烁光标 -->
    <rect class="cursor" x="850" y="70" width="3" height="55" fill="#BB86FC"/>
</svg>
